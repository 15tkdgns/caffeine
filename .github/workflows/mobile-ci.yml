name: Mobile App CI (Expo React Native)

on:
  push:
    branches: ["dev", "main"]

jobs:
  mobile-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Expo build check
        run: npm run build:check   # (expo export 또는 jest, etc.)

      # Removed Expo web build
      - name: Validate project structure
        run: echo "Mobile build check passed!"

