name: Deploy FastAPI Backend to AWS (EC2 via SSH)

on:
  # 수동 실행용. GitHub Actions > 이 워크플로 선택 > Run workflow 버튼으로 실행
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (e.g. dev or prod)"
        required: false
        default: "dev"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # SSH private key for EC2 접속 (GitHub Secrets 에 설정 필요)
      # - AWS_EC2_SSH_KEY  : EC2 접속용 개인키 (PEM 내용 전체)
      # - AWS_EC2_USER     : 예) ubuntu
      # - AWS_EC2_HOST     : 예) 3.34.xxx.xxx
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AWS_EC2_SSH_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << 'EOF'
            set -e

            # TODO: EC2 안에서 실제 프로젝트 경로로 변경 (예: /home/ubuntu/caffeine)
            cd ~/caffeine

            # 최신 코드 가져오기 (main 또는 dev 등, 프로젝트 전략에 맞게 변경)
            git fetch origin
            git checkout main
            git pull origin main

            # Python 가상환경 준비
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            pip install --upgrade pip
            pip install -r backend/requirements.txt

            # TODO: 여기서부터는 실제 백엔드 서비스 재시작 방식에 맞게 수정
            # 예시 1: systemd
            # sudo systemctl restart caffeine-backend.service

            # 예시 2: tmux/screen + uvicorn
            # pkill -f "uvicorn app.main:app" || true
            # nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

          EOF

