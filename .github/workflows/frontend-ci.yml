name: Frontend CI (build, test, lint)

on:
  # dev2에 push 될 때마다 실행
  push:
    branches: [ "dev2" ]

  # dev2나 main 대상으로 PR 열릴 때도 실행
  pull_request:
    branches: [ "dev2", "main" ]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 🔍 코드 품질 검사 (ESLint)
      # package.json 에 "lint" 스크립트가 있을 때 유효
      - name: Run lint
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script. Skipping lint step."
          fi

      # ✅ 테스트 (CRA 기본 test 사용)
      - name: Run tests
        env:
          CI: true
        run: |
          if npm run | grep -q "test"; then
            npm test -- --watch=false --passWithNoTests
          else
            echo "No test script. Skipping test step."
          fi

      # 🏗 빌드 (React 빌드가 깨지는지 확인)
      - name: Build
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script. Skipping build step."
          fi
